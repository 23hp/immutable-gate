---
- name: Setup Talos Linux Node
  hosts: localhost
  gather_facts: false
  vars:
    talos_endpoint: master
    talos_hostname: ape
  tasks:
    - name: Setup Talos worker
      ansible.builtin.include_role:
        name: talos
        tasks_from: "{{ item }}"
      loop:
        - gen_worker_config
        - activate_worker