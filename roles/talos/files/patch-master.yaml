# etcd-metrics-patch
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
---
# partition
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
mount:
  disableAccessTime: true
---
# cilium
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false