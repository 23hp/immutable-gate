# etcd-metrics-patch
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
---
# partition
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
mount:
  disableAccessTime: true
---
# cilium
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# less audit log
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  omitStages:
    - RequestReceived
  rules:
    - level: None
      resources:
        - group: coordination.k8s.io
          resources: ["leases"]
    - level: None
      nonResourceURLs:
        - /healthz*
        - /livez*
        - /readyz*
        - /version
    - level: Metadata