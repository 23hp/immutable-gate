---
- name: Ensure controlplane.yaml exists
  ansible.builtin.file:
    path: "{{ talos_config_path }}/controlplane.yaml"
    mode: '0700'

- name: Wait for maintenance state
  ansible.builtin.command: "talosctl get machinestatus --insecure -n {{ talos_hostname }} -o jsonpath='{.spec.stage}'"
  register: talos_machinestatus
  until: talos_machinestatus.stdout == "maintenance"
  retries: 20
  delay: 5
  changed_when: false

- name: Apply Talos config to controlplane node
  ansible.builtin.command: |
    talosctl apply-config \
    --insecure \
    --file controlplane.yaml \
    --nodes {{ talos_hostname }}
  args:
    chdir: "{{ talos_config_path }}"

- name: Wait for kubelet to be healthy
  ansible.builtin.shell: "talosctl service kubelet -n {{ talos_hostname }} | grep -q 'HEALTH.*OK'"
  register: talos_kubelet_status
  until: talos_kubelet_status.rc == 0
  changed_when: false
  retries: 20
  delay: 15

- name: Bootstrap Talos cluster
  ansible.builtin.command: talosctl bootstrap -n {{ talos_hostname }}

- name: Fetch kubeconfig
  ansible.builtin.command: talosctl kubeconfig -n {{ talos_hostname }}

- name: Wait for Talos cluster health
  ansible.builtin.command: talosctl health -n {{ talos_hostname }} --wait-timeout 10m
  register: health_result
  until: health_result is succeeded
  retries: 10
  delay: 15